name: daily-gift-card-guide

on:
  schedule:
    # Once per day, 08:15 UTC — one gift-card guide max (queue order).
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gift-card-guide
  cancel-in-progress: false

jobs:
  publish-one-gift-card-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Playwright fallback for 403 official pages)
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Publish at most one gift-card guide (daily queue)
        run: python tools/daily_publish_gift_cards.py

      - name: Scrape public offers
        run: python scraper.py

      - name: Export public CSV / brand list
        run: python tools/export_public_assets.py

      - name: Build static site
        run: python build.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name hellofresh-deals-promo-radar --branch main

      - name: Commit gift-card guide and refreshed data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gift_card_guides.json .ilang/site.ilang data/offers.json public/ || true
          if git diff --staged --quiet; then
            echo "No publish/data changes today"
          else
            git commit -m "chore: daily gift-card guide $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
