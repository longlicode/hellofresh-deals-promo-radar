name: update-offers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "browser_render.py"
      - "build.py"
      - "requirements.txt"
      - "ilang_config.py"
      - ".ilang/**"
      - "templates/**"
      - "data/**"
      - "tools/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-offers
  cancel-in-progress: false

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scrape dependencies (Playwright for RENDER_JS brands)
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Scrape public offers
        run: python scraper.py

      - name: Export public CSV / brand list
        run: python tools/export_public_assets.py

      - name: Audit offer quality
        run: python tools/audit_offer_quality.py

      - name: Build static site
        run: python build.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name hellofresh-deals-promo-radar --branch main

      - name: Commit scraped data (not generated HTML)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json public/
          if git diff --staged --quiet; then
            echo "No data/export changes"
          else
            git commit -m "chore: refresh offers $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
